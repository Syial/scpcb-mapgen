name: conformance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # typecheck + build du site
      - run: npm run build
      # suite de conformité bit-exacte (6 seeds, 7321 extents)
      - run: npm test
      # filtres de recherche
      - run: npm run test:filters
